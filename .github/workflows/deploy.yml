name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the AWS variables exist (first terraform apply, see README).
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # Set these repository variables after the first `terraform apply` (see README).
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      # Hashed assets never change: cache for a year. Everything else: always revalidate.
      - name: Upload to S3
        run: |
          aws s3 sync dist/_astro "s3://$S3_BUCKET/_astro" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$S3_BUCKET" --delete --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync dist/_astro "s3://$S3_BUCKET/_astro" --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
